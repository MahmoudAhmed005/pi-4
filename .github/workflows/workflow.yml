name: CI Worker Node

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: 'Worker ID'
        required: true
        default: 'generic-worker'
      restore_source:
        description: 'repo | artifact | release | all | none (default: release)'
        required: true
        default: 'release'

permissions:
  contents: write
  actions: read

jobs:
  processor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ============================================================
      # 1. TAILSCALE
      # ============================================================
      - name: Initialize Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ github.event.inputs.worker_id }}
          tags: tag:ci
          args: --ssh

      # ============================================================
      # 2. RESTORE
      # ============================================================
      - name: Fetch Environment State
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
          RESTORE_SOURCE: ${{ github.event.inputs.restore_source }}
          TARGET_USER: ${{ github.event.inputs.worker_id }}
        run: |
          set -euo pipefail

          # ---- Move everything off tmpfs onto the real 140 GB disk ----
          export TMPDIR=/home/runner/tmp
          mkdir -p "$TMPDIR"

          echo "=== Disk before cleanup ==="
          df -h / /tmp /home 2>/dev/null || true

          # ---- Free ~8 GB of pre-installed SDKs ----
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h / /tmp /home 2>/dev/null || true

          mkdir -p /home/runner/work
          cd /home/runner/work

          CLEAN_TOKEN=$(echo -n "$GH_TOKEN" | tr -d '[:space:]')
          CLEAN_REPO=$(echo -n "$REPO_NAME" | tr -d '[:space:]')

          decrypt_blob() {
            local in="$1" out="$2"
            for iter in 100000 10000 1000 1; do
              if openssl enc -aes-256-cbc -d -pbkdf2 -iter "$iter" \
                   -pass pass:"$ENC_PASS" -in "$in" -out "$out" 2>/dev/null; then
                if [ -f "$out" ] && [ "$(head -c 2 "$out" | xxd -p 2>/dev/null)" = "1f8b" ]; then
                  echo "Decrypted with iter=$iter (valid gzip)"
                  return 0
                fi
              fi
            done
            echo "All decryption attempts failed or produced invalid gzip for $in"
            return 1
          }

          validate_and_extract() {
            local tarball="$1" label="$2"
            if tar -tzf "$tarball" >/dev/null 2>&1; then
              sudo tar -xzf "$tarball" -C / --no-same-owner --overwrite
              echo "✅ Restored from $label"
              return 0
            else
              echo "⚠️  $label archive is corrupt, skipping"
              return 1
            fi
          }

          if [[ "$RESTORE_SOURCE" == "none" ]]; then
            echo "Skipping restore (source=none)."
            exit 0
          fi

          RESTORED=""

          # --- A. Private repo chunks ---
          if [[ -z "$RESTORED" && ("$RESTORE_SOURCE" == "repo" || "$RESTORE_SOURCE" == "all") ]]; then
            echo "=== Trying REPO ==="
            if git clone "https://x-access-token:${CLEAN_TOKEN}@github.com/${{ github.repository_owner }}/${CLEAN_REPO}.git" state-repo 2>/dev/null; then
              if ls state-repo/chunks/state_part_* 1>/dev/null 2>&1; then
                cat state-repo/chunks/state_part_* > "$TMPDIR/repo.tar.gz.enc"
                if decrypt_blob "$TMPDIR/repo.tar.gz.enc" "$TMPDIR/repo.tar.gz"; then
                  if validate_and_extract "$TMPDIR/repo.tar.gz" "REPO"; then
                    RESTORED="REPO"
                  fi
                fi
              fi
            fi
            rm -f "$TMPDIR/repo.tar.gz.enc" "$TMPDIR/repo.tar.gz"
            rm -rf state-repo
          fi

          # --- B. Artifact ---
          if [[ -z "$RESTORED" && ("$RESTORE_SOURCE" == "artifact" || "$RESTORE_SOURCE" == "all") ]]; then
            echo "=== Trying ARTIFACT ==="
            ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-backup" \
              --jq '.artifacts | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
            if [[ -n "$ART_ID" && "$ART_ID" != "null" ]]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip" > "$TMPDIR/artifact.zip"
              rm -rf "$TMPDIR/artifact" && unzip -o "$TMPDIR/artifact.zip" -d "$TMPDIR/artifact" >/dev/null
              if decrypt_blob "$TMPDIR/artifact/state.tar.gz.enc" "$TMPDIR/artifact.tar.gz"; then
                if validate_and_extract "$TMPDIR/artifact.tar.gz" "ARTIFACT"; then
                  RESTORED="ARTIFACT"
                fi
              fi
            fi
            rm -f "$TMPDIR/artifact.zip" "$TMPDIR/artifact.tar.gz"
            rm -rf "$TMPDIR/artifact"
          fi

          # --- C. Release ---
          if [[ -z "$RESTORED" && ("$RESTORE_SOURCE" == "release" || "$RESTORE_SOURCE" == "all") ]]; then
            echo "=== Trying RELEASE ==="
            rm -rf "$TMPDIR/release" && mkdir -p "$TMPDIR/release"
            if gh release download --repo "${{ github.repository }}" \
                 --pattern 'state.tar.gz.enc' --dir "$TMPDIR/release" 2>/dev/null; then
              if decrypt_blob "$TMPDIR/release/state.tar.gz.enc" "$TMPDIR/release.tar.gz"; then
                if validate_and_extract "$TMPDIR/release.tar.gz" "RELEASE"; then
                  RESTORED="RELEASE"
                fi
              fi
            fi
            rm -f "$TMPDIR/release/state.tar.gz.enc" "$TMPDIR/release.tar.gz"
            rm -rf "$TMPDIR/release"
          fi

          # --- D. Post-restore cleanup ---
          if id "$TARGET_USER" &>/dev/null; then
            sudo mkdir -p "/home/$TARGET_USER"
            sudo chown -R "$TARGET_USER:$TARGET_USER" "/home/$TARGET_USER" 2>/dev/null || true
            echo "Fixed ownership of /home/$TARGET_USER"
          fi

          # Free temp dir
          rm -rf "$TMPDIR" 2>/dev/null || true

          if [[ -z "$RESTORED" ]]; then
            echo "⚠️  No source successfully restored."
          else
            echo "✅ Restore complete: $RESTORED"
          fi

      # ============================================================
      # 3. PAYLOAD
      # ============================================================
      - name: Process Workload
        run: |
          set -euo pipefail
          export TMPDIR=/home/runner/tmp
          mkdir -p "$TMPDIR"

          TARGET_USER="${{ github.event.inputs.worker_id }}"

          if ! id "$TARGET_USER" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$TARGET_USER"
            sudo usermod -aG sudo "$TARGET_USER"
          fi

          sudo mkdir -p "/home/$TARGET_USER"
          sudo chown -R "$TARGET_USER:$TARGET_USER" "/home/$TARGET_USER"
          sudo chmod 755 "/home/$TARGET_USER"

          echo "$TARGET_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/99-$TARGET_USER >/dev/null
          sudo chmod 0440 /etc/sudoers.d/99-$TARGET_USER

          if [ -f "/home/$TARGET_USER/.cloud_init" ]; then
            echo "Launching .cloud_init..."
            sudo -u "$TARGET_USER" bash "/home/$TARGET_USER/.cloud_init" > /dev/null 2>&1 &
            WORKLOAD_PID=$!
            echo "$WORKLOAD_PID" | sudo tee "/home/$TARGET_USER/.cloud_init.pid" >/dev/null
            echo "Workload PID: $WORKLOAD_PID"
          else
            echo "No .cloud_init found, running idle."
          fi

          MAX_TICKS=$(( (5 * 60 + 20) * 60 / 10 ))
          for i in $(seq 1 $MAX_TICKS); do
            if [ -f /tmp/stop_worker ]; then
              echo "Stop marker found at tick $i (~$((i*10))s)"
              break
            fi
            sleep 10
          done
          echo "Workload loop exited after $i ticks (~$((i*10))s)"

      # ============================================================
      # 4. FINALIZE
      # ============================================================
      - name: Finalize Environment State
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
          TARGET_USER: ${{ github.event.inputs.worker_id }}
        run: |
          set -euo pipefail
          export TMPDIR=/home/runner/tmp
          mkdir -p "$TMPDIR"

          echo "Finalizing state..."
          mkdir -p /home/runner/work

          # ---- Signal workload ----
          if [ -f "/home/$TARGET_USER/.cloud_init.pid" ]; then
            WORKLOAD_PID=$(sudo cat "/home/$TARGET_USER/.cloud_init.pid" 2>/dev/null || echo "")
            if [ -n "$WORKLOAD_PID" ] && kill -0 "$WORKLOAD_PID" 2>/dev/null; then
              echo "Sending SIGINT to workload PID $WORKLOAD_PID"
              sudo kill -SIGINT "$WORKLOAD_PID" 2>/dev/null || true
              sleep 10
            else
              echo "Workload PID $WORKLOAD_PID not running."
            fi
          else
            echo "No workload PID file, skipping signal."
          fi

          cd /home/runner/work
          CLEAN_TOKEN=$(echo -n "$GH_TOKEN" | tr -d '[:space:]')
          CLEAN_REPO=$(echo -n "$REPO_NAME" | tr -d '[:space:]')

          if [ ! -d "/home/$TARGET_USER" ]; then
            echo "⚠️  /home/$TARGET_USER missing — creating empty dir"
            sudo mkdir -p "/home/$TARGET_USER"
            sudo chown "$TARGET_USER:$TARGET_USER" "/home/$TARGET_USER"
          fi

          # ---- Free disk before tar ----
          rm -rf "$TMPDIR"/* 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /root/.npm/_cacache 2>/dev/null || true
          df -h /

          # ---- Pre-tar content check ----
          echo "=== Pre-backup content check ==="
          for d in "/home/$TARGET_USER/.hermes" "/home/$TARGET_USER/.omniroute"; do
            if [ -d "$d" ]; then
              echo "$d: $(sudo find "$d" -type f 2>/dev/null | wc -l) files, $(sudo du -sh "$d" 2>/dev/null | cut -f1)"
            else
              echo "⚠️  $d MISSING"
            fi
          done

          # ---- Compress + encrypt (shrunk) ----
          set +e
          sudo tar -czPf - \
            --warning=no-file-changed \
            --exclude=/home/runner/work/state-repo \
            --exclude=/home/runner/work/_actions \
            --exclude='*/.git' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/runtime' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/tls-client' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/logs' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/call_logs' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/backups' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/db_backups' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/qoder-cli' \
            --exclude='/home/'"$TARGET_USER"'/.hermes/hermes-agent/venv' \
            --exclude='*/.hermes/**/__pycache__' \
            --exclude='*/.hermes/**/*.pyc' \
            --exclude='*/.hermes/logs' \
            --exclude='*/.hermes/cache' \
            --exclude='*/.hermes/.cache' \
            --exclude='*/.hermes/models' \
            --exclude='*/.hermes/node_modules' \
            --exclude='*/.npm' \
            --exclude='*/.cache' \
            --exclude='*/.cargo/registry' \
            --exclude='*/.rustup/toolchains' \
            /home/runner/work /home/"$TARGET_USER" 2>"$TMPDIR/tar-warnings.log" \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
                -pass pass:"$ENC_PASS" -out "$TMPDIR/state.tar.gz.enc"
          TAR_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$TAR_EXIT" -eq 1 ]; then
            echo "⚠️  Tar exit 1 (files changed during read) — acceptable."
          elif [ "$TAR_EXIT" -ne 0 ]; then
            echo "❌ Tar exit $TAR_EXIT — fatal:"
            head -20 "$TMPDIR/tar-warnings.log"
            exit 1
          fi

          if [ ! -s "$TMPDIR/state.tar.gz.enc" ]; then
            echo "❌ state.tar.gz.enc empty or missing"
            exit 1
          fi

          sha256sum "$TMPDIR/state.tar.gz.enc" | awk '{print $1}' > "$TMPDIR/state.sha256"
          LOCAL_HASH=$(cat "$TMPDIR/state.sha256")
          echo "LOCAL HASH: $LOCAL_HASH"
          echo "Encrypted size: $(du -h "$TMPDIR/state.tar.gz.enc" | cut -f1)"

          # ---- Post-tar content check (single pass) ----
          echo "=== Post-tar content check ==="
          sudo tar -tzf "$TMPDIR/state.tar.gz.enc" >/dev/null 2>&1 || true
          # We can't list an encrypted file; decrypt without extracting to /tmp
          openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 -pass pass:"$ENC_PASS" \
            -in "$TMPDIR/state.tar.gz.enc" 2>/dev/null | tar -tzf - > "$TMPDIR/tar-list.txt" 2>/dev/null || true
          HERMES_COUNT=$(grep -c '\.hermes' "$TMPDIR/tar-list.txt" 2>/dev/null || echo 0)
          OMNI_COUNT=$(grep -c '\.omniroute' "$TMPDIR/tar-list.txt" 2>/dev/null || echo 0)
          TOTAL_COUNT=$(wc -l < "$TMPDIR/tar-list.txt" 2>/dev/null || echo 0)
          echo "hermes files:    $HERMES_COUNT"
          echo "omniroute files: $OMNI_COUNT"
          echo "total entries:   $TOTAL_COUNT"
          rm -f "$TMPDIR/tar-list.txt"

          # ---- Prep artifact dir ----
          mkdir -p "$TMPDIR/artifact-out"
          cp "$TMPDIR/state.tar.gz.enc" "$TMPDIR/artifact-out/"
          cp "$TMPDIR/state.sha256"      "$TMPDIR/artifact-out/"

          # ============================================================
          # Fresh clone for backup repo
          # ============================================================
          rm -rf "$TMPDIR/backup-repo"
          if git clone "https://x-access-token:${CLEAN_TOKEN}@github.com/${{ github.repository_owner }}/${CLEAN_REPO}.git" "$TMPDIR/backup-repo" 2>/dev/null; then
            echo "Cloned existing backup repo"
          else
            echo "Backup repo empty or clone failed, initializing fresh"
            mkdir -p "$TMPDIR/backup-repo"
            cd "$TMPDIR/backup-repo"
            git init
            git remote add origin "https://x-access-token:${CLEAN_TOKEN}@github.com/${{ github.repository_owner }}/${CLEAN_REPO}.git"
          fi

          cd "$TMPDIR/backup-repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan temp-branch 2>/dev/null || git checkout temp-branch
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          mkdir -p chunks
          rm -f chunks/state_part_*
          split -b 50M "$TMPDIR/state.tar.gz.enc" chunks/state_part_
          cp "$TMPDIR/state.sha256" ./state.sha256

          git add -A
          git commit -m "Automated State Finalization [skip ci]" || echo "nothing to commit"
          git branch -M main

          # Non-fatal push
          if git push -f origin main 2>"$TMPDIR/push-error.log"; then
            echo "✅ Repo push succeeded"
          else
            echo "⚠️  Repo push failed — continuing"
            head -5 "$TMPDIR/push-error.log" || true
          fi

          # ============================================================
          # Create release
          # ============================================================
          TAG="state-$(date +%Y%m%d-%H%M%S)"
          echo "$TAG" > "$TMPDIR/state-tag.txt"
          echo "Creating release: $TAG"
          if gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Encrypted State $TAG" \
              --notes "sha256: $LOCAL_HASH" \
              "$TMPDIR/state.tar.gz.enc" "$TMPDIR/state.sha256"; then
            echo "✅ Release $TAG created"
          else
            echo "⚠️  Release creation failed (continuing)"
          fi

      # ============================================================
      # 5. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Encrypted Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-backup
          path: |
            /home/runner/tmp/artifact-out/state.tar.gz.enc
            /home/runner/tmp/artifact-out/state.sha256
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 6. COMPARE HASHES
      # ============================================================
      - name: Compare Hashes Across Sources
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
        run: |
          set -euo pipefail
          export TMPDIR=/home/runner/tmp

          if [ ! -f "$TMPDIR/state.sha256" ]; then
            echo "❌ $TMPDIR/state.sha256 missing — finalize step failed."
            exit 1
          fi

          LOCAL_HASH=$(cat "$TMPDIR/state.sha256")

          # Repo — fetch from remote, not local clone
          rm -rf "$TMPDIR/remote-repo"
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${{ secrets.BACKUP_REPO }}.git" "$TMPDIR/remote-repo" 2>/dev/null; then
            if ls "$TMPDIR/remote-repo/chunks/state_part_*" 1>/dev/null 2>&1; then
              cat "$TMPDIR/remote-repo/chunks/state_part_*" > "$TMPDIR/from_repo.enc"
              REPO_HASH=$(sha256sum "$TMPDIR/from_repo.enc" | awk '{print $1}')
            else
              REPO_HASH="MISSING"
            fi
          else
            REPO_HASH="CLONE_FAILED"
          fi
          rm -rf "$TMPDIR/remote-repo" "$TMPDIR/from_repo.enc"

          # Artifact
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-backup" \
            --jq '.artifacts | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
          if [[ -n "$ART_ID" && "$ART_ID" != "null" ]]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip" > "$TMPDIR/art.zip"
            rm -rf "$TMPDIR/art" && unzip -o "$TMPDIR/art.zip" -d "$TMPDIR/art" >/dev/null
            ART_HASH=$(sha256sum "$TMPDIR/art/state.tar.gz.enc" | awk '{print $1}')
          else
            ART_HASH="MISSING"
          fi
          rm -f "$TMPDIR/art.zip"
          rm -rf "$TMPDIR/art"

          # Release — only the one created this run
          REL_HASH="NOT_CREATED"
          if [ -f "$TMPDIR/state-tag.txt" ]; then
            TAG=$(cat "$TMPDIR/state-tag.txt")
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              rm -rf "$TMPDIR/rel" && mkdir -p "$TMPDIR/rel"
              gh release download "$TAG" --repo "${{ github.repository }}" \
                --pattern 'state.tar.gz.enc' --dir "$TMPDIR/rel" 2>/dev/null
              REL_HASH=$(sha256sum "$TMPDIR/rel/state.tar.gz.enc" 2>/dev/null | awk '{print $1}')
              rm -rf "$TMPDIR/rel"
            fi
          fi

          echo "LOCAL : $LOCAL_HASH"
          echo "REPO  : $REPO_HASH"
          echo "ART   : $ART_HASH"
          echo "REL   : $REL_HASH"

          # Warning-only mismatch (repo push may exceed GitHub limits)
          MATCH=0
          [ "$LOCAL_HASH" = "$REPO_HASH" ] && MATCH=$((MATCH+1))
          [ "$LOCAL_HASH" = "$ART_HASH" ]  && MATCH=$((MATCH+1))
          [ "$LOCAL_HASH" = "$REL_HASH" ]  && MATCH=$((MATCH+1))

          if [ "$MATCH" -ge 2 ]; then
            echo "✅ At least 2 sources match."
          else
            echo "❌ Fewer than 2 sources match."
            exit 1
          fi
