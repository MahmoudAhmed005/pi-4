name: CI Worker Node

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: 'Worker ID'
        required: true
        default: 'generic-worker'
      restore_source:
        description: 'repo | artifact | release | all | none'
        required: true
        default: 'all'

permissions:
  contents: write
  actions: read

jobs:
  processor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ============================================================
      # 1. TAILSCALE
      # ============================================================
      - name: Initialize Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ github.event.inputs.worker_id }}
          tags: tag:ci
          args: --ssh

      # ============================================================
      # 2. RESTORE
      # ============================================================
      - name: Fetch Environment State
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
          RESTORE_SOURCE: ${{ github.event.inputs.restore_source }}
          TARGET_USER: ${{ github.event.inputs.worker_id }}
        run: |
          set -euo pipefail
          mkdir -p /home/runner/work
          cd /home/runner/work

          CLEAN_TOKEN=$(echo -n "$GH_TOKEN" | tr -d '[:space:]')
          CLEAN_REPO=$(echo -n "$REPO_NAME" | tr -d '[:space:]')

          decrypt_blob() {
            local in="$1" out="$2"
            for iter in 100000 10000 1000 1; do
              if openssl enc -aes-256-cbc -d -pbkdf2 -iter "$iter" \
                   -pass pass:"$ENC_PASS" -in "$in" -out "$out" 2>/dev/null; then
                # Validate gzip magic bytes
                if [ -f "$out" ] && [ "$(head -c 2 "$out" | xxd -p 2>/dev/null)" = "1f8b" ]; then
                  echo "Decrypted with iter=$iter (valid gzip)"
                  return 0
                fi
              fi
            done
            echo "All decryption attempts failed or produced invalid gzip for $in"
            return 1
          }

          validate_and_extract() {
            local tarball="$1" label="$2"
            if tar -tzf "$tarball" >/dev/null 2>&1; then
              sudo tar -xzf "$tarball" -C / --no-same-owner --overwrite
              echo "Restored from $label"
              return 0
            else
              echo "⚠️  $label archive is corrupt, skipping"
              return 1
            fi
          }

          if [[ "$RESTORE_SOURCE" == "none" ]]; then
            echo "Skipping restore (source=none)."
            exit 0
          fi

          # --- A. Private repo chunks ---
          if [[ "$RESTORE_SOURCE" == "repo" || "$RESTORE_SOURCE" == "all" ]]; then
            if git clone "https://x-access-token:${CLEAN_TOKEN}@github.com/${{ github.repository_owner }}/${CLEAN_REPO}.git" state-repo 2>/dev/null; then
              if ls state-repo/chunks/state_part_* 1>/dev/null 2>&1; then
                cat state-repo/chunks/state_part_* > /tmp/repo.tar.gz.enc
                if decrypt_blob /tmp/repo.tar.gz.enc /tmp/repo.tar.gz; then
                  validate_and_extract /tmp/repo.tar.gz "REPO" || true
                fi
              fi
            fi
          fi

          # --- B. Artifact ---
          if [[ "$RESTORE_SOURCE" == "artifact" || "$RESTORE_SOURCE" == "all" ]]; then
            ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-backup" \
              --jq '.artifacts | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
            if [[ -n "$ART_ID" && "$ART_ID" != "null" ]]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip" > /tmp/artifact.zip
              rm -rf /tmp/artifact && unzip -o /tmp/artifact.zip -d /tmp/artifact >/dev/null
              if decrypt_blob /tmp/artifact/state.tar.gz.enc /tmp/artifact.tar.gz; then
                validate_and_extract /tmp/artifact.tar.gz "ARTIFACT" || true
              fi
            fi
          fi

          # --- C. Release ---
          if [[ "$RESTORE_SOURCE" == "release" || "$RESTORE_SOURCE" == "all" ]]; then
            rm -rf /tmp/release && mkdir -p /tmp/release
            if gh release download --repo "${{ github.repository }}" \
                 --pattern 'state.tar.gz.enc' --dir /tmp/release 2>/dev/null; then
              if decrypt_blob /tmp/release/state.tar.gz.enc /tmp/release.tar.gz; then
                validate_and_extract /tmp/release.tar.gz "RELEASE" || true
              fi
            fi
          fi

          # --- D. Post-restore cleanup ---
          if id "$TARGET_USER" &>/dev/null; then
            sudo mkdir -p "/home/$TARGET_USER"
            sudo chown -R "$TARGET_USER:$TARGET_USER" "/home/$TARGET_USER" 2>/dev/null || true
            echo "Fixed ownership of /home/$TARGET_USER"
          fi

      # ============================================================
      # 3. PAYLOAD
      # ============================================================
      - name: Process Workload
        run: |
          set -euo pipefail
          TARGET_USER="${{ github.event.inputs.worker_id }}"

          if ! id "$TARGET_USER" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$TARGET_USER"
            sudo usermod -aG sudo "$TARGET_USER"
          fi

          sudo mkdir -p "/home/$TARGET_USER"
          sudo chown -R "$TARGET_USER:$TARGET_USER" "/home/$TARGET_USER"
          sudo chmod 755 "/home/$TARGET_USER"

          echo "$TARGET_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/99-$TARGET_USER >/dev/null
          sudo chmod 0440 /etc/sudoers.d/99-$TARGET_USER

          if [ -f "/home/$TARGET_USER/.cloud_init" ]; then
            echo "Launching .cloud_init..."
            sudo -u "$TARGET_USER" bash "/home/$TARGET_USER/.cloud_init" > /dev/null 2>&1 &
            WORKLOAD_PID=$!
            echo "$WORKLOAD_PID" | sudo tee "/home/$TARGET_USER/.cloud_init.pid" >/dev/null
            echo "Workload PID: $WORKLOAD_PID"
          else
            echo "No .cloud_init found, running idle."
          fi

          MAX_TICKS=$(( (5 * 60 + 20) * 60 / 10 ))
          for i in $(seq 1 $MAX_TICKS); do
            if [ -f /tmp/stop_worker ]; then
              echo "Stop marker found at tick $i (~$((i*10))s)"
              break
            fi
            sleep 10
          done
          echo "Workload loop exited after $i ticks (~$((i*10))s)"

      # ============================================================
      # 4. FINALIZE
      # ============================================================
      - name: Finalize Environment State
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
          TARGET_USER: ${{ github.event.inputs.worker_id }}
        run: |
          set -euo pipefail
          echo "Finalizing state..."

          mkdir -p /home/runner/work

          # ---- Signal workload ----
          if [ -f "/home/$TARGET_USER/.cloud_init.pid" ]; then
            WORKLOAD_PID=$(sudo cat "/home/$TARGET_USER/.cloud_init.pid" 2>/dev/null || echo "")
            if [ -n "$WORKLOAD_PID" ] && kill -0 "$WORKLOAD_PID" 2>/dev/null; then
              echo "Sending SIGINT to workload PID $WORKLOAD_PID"
              sudo kill -SIGINT "$WORKLOAD_PID" 2>/dev/null || true
              sleep 10
            else
              echo "Workload PID $WORKLOAD_PID not running."
            fi
          else
            echo "No workload PID file, skipping signal."
          fi

          cd /home/runner/work
          CLEAN_TOKEN=$(echo -n "$GH_TOKEN" | tr -d '[:space:]')
          CLEAN_REPO=$(echo -n "$REPO_NAME" | tr -d '[:space:]')

          if [ ! -d "/home/$TARGET_USER" ]; then
            echo "⚠️  /home/$TARGET_USER missing — creating empty dir"
            sudo mkdir -p "/home/$TARGET_USER"
            sudo chown "$TARGET_USER:$TARGET_USER" "/home/$TARGET_USER"
          fi

          # ---- Pre-tar content check ----
          echo "=== Pre-backup content check ==="
          for d in "/home/$TARGET_USER/.hermes" "/home/$TARGET_USER/.omniroute"; do
            if [ -d "$d" ]; then
              echo "$d: $(sudo find "$d" -type f 2>/dev/null | wc -l) files, $(sudo du -sh "$d" 2>/dev/null | cut -f1)"
            else
              echo "⚠️  $d MISSING"
            fi
          done

          # ---- Compress + encrypt ----
          set +e
          sudo tar -czPf - \
            --warning=no-file-changed \
            --exclude=/home/runner/work/state-repo \
            --exclude=/home/runner/work/_actions \
            --exclude='*/.git' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/runtime' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/tls-client' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/logs' \
            --exclude='/home/'"$TARGET_USER"'/.omniroute/call_logs' \
            /home/runner/work /home/"$TARGET_USER" 2>/tmp/tar-warnings.log \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
                -pass pass:"$ENC_PASS" -out /tmp/state.tar.gz.enc
          TAR_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$TAR_EXIT" -eq 1 ]; then
            echo "⚠️  Tar exit 1 (files changed during read) — acceptable."
          elif [ "$TAR_EXIT" -ne 0 ]; then
            echo "❌ Tar exit $TAR_EXIT — fatal:"
            head -20 /tmp/tar-warnings.log
            exit 1
          fi

          if [ ! -s /tmp/state.tar.gz.enc ]; then
            echo "❌ /tmp/state.tar.gz.enc empty or missing"
            exit 1
          fi

          sha256sum /tmp/state.tar.gz.enc | awk '{print $1}' > /tmp/state.sha256
          LOCAL_HASH=$(cat /tmp/state.sha256)
          echo "LOCAL HASH: $LOCAL_HASH"
          echo "Encrypted size: $(du -h /tmp/state.tar.gz.enc | cut -f1)"

          # ---- Post-tar content check (single pass) ----
          echo "=== Post-tar content check ==="
          sudo tar -tzf /tmp/state.tar.gz > /tmp/tar-list.txt 2>/dev/null || true
          HERMES_COUNT=$(grep -c '\.hermes' /tmp/tar-list.txt || true)
          OMNI_COUNT=$(grep -c '\.omniroute' /tmp/tar-list.txt || true)
          TOTAL_COUNT=$(wc -l < /tmp/tar-list.txt || echo 0)
          echo "hermes files:    $HERMES_COUNT"
          echo "omniroute files: $OMNI_COUNT"
          echo "total entries:   $TOTAL_COUNT"

          # ---- Prep artifact dir ----
          mkdir -p /tmp/artifact-out
          cp /tmp/state.tar.gz.enc /tmp/artifact-out/
          cp /tmp/state.sha256      /tmp/artifact-out/
          ls -la /tmp/artifact-out/

          # ============================================================
          # Fresh clone of the backup repo — never reuse the restore clone
          # ============================================================
          rm -rf /tmp/backup-repo
          if git clone "https://x-access-token:${CLEAN_TOKEN}@github.com/${{ github.repository_owner }}/${CLEAN_REPO}.git" /tmp/backup-repo 2>/dev/null; then
            echo "Cloned existing backup repo"
          else
            echo "Backup repo empty or clone failed, initializing fresh"
            mkdir -p /tmp/backup-repo
            cd /tmp/backup-repo
            git init
            git remote add origin "https://x-access-token:${CLEAN_TOKEN}@github.com/${{ github.repository_owner }}/${CLEAN_REPO}.git"
          fi

          cd /tmp/backup-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Orphan branch: start with a clean index, keep the working tree empty
          git checkout --orphan temp-branch 2>/dev/null || git checkout temp-branch
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          # ---- Write fresh chunks (after the clean) ----
          mkdir -p chunks
          rm -f chunks/state_part_*
          split -b 50M /tmp/state.tar.gz.enc chunks/state_part_
          cp /tmp/state.sha256 ./state.sha256

          git add -A
          git commit -m "Automated State Finalization [skip ci]" || echo "nothing to commit"
          git branch -M main
          git push -f origin main

          # ============================================================
          # Create release
          # ============================================================
          TAG="state-$(date +%Y%m%d-%H%M%S)"
          echo "Creating release: $TAG"
          if gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Encrypted State $TAG" \
              --notes "sha256: $LOCAL_HASH" \
              /tmp/state.tar.gz.enc /tmp/state.sha256; then
            echo "✅ Release $TAG created"
          else
            echo "⚠️  Release creation failed (continuing)"
          fi

      # ============================================================
      # 5. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Encrypted Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-backup
          path: |
            /tmp/artifact-out/state.tar.gz.enc
            /tmp/artifact-out/state.sha256
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 6. COMPARE HASHES
      # ============================================================
      - name: Compare Hashes Across Sources
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
        run: |
          set -euo pipefail
          cd /home/runner/work

          if [ ! -f /tmp/state.sha256 ]; then
            echo "❌ /tmp/state.sha256 missing — finalize step failed."
            exit 1
          fi

          LOCAL_HASH=$(cat /tmp/state.sha256)

          # Repo — read from the fresh clone pushed in Finalize
          if ls /tmp/backup-repo/chunks/state_part_* 1>/dev/null 2>&1; then
            cat /tmp/backup-repo/chunks/state_part_* > /tmp/from_repo.enc
            REPO_HASH=$(sha256sum /tmp/from_repo.enc | awk '{print $1}')
          else
            REPO_HASH="MISSING"
          fi

          # Artifact
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=state-backup" \
            --jq '.artifacts | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
          if [[ -n "$ART_ID" && "$ART_ID" != "null" ]]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip" > /tmp/art.zip
            rm -rf /tmp/art && unzip -o /tmp/art.zip -d /tmp/art >/dev/null
            ART_HASH=$(sha256sum /tmp/art/state.tar.gz.enc | awk '{print $1}')
          else
            ART_HASH="MISSING"
          fi

          # Release
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          if gh release download --repo "${{ github.repository }}" \
               --pattern 'state.tar.gz.enc' --dir /tmp/rel 2>/dev/null; then
            REL_HASH=$(sha256sum /tmp/rel/state.tar.gz.enc | awk '{print $1}')
          else
            REL_HASH="MISSING"
          fi

          echo "LOCAL : $LOCAL_HASH"
          echo "REPO  : $REPO_HASH"
          echo "ART   : $ART_HASH"
          echo "REL   : $REL_HASH"

          if [[ "$LOCAL_HASH" == "$REPO_HASH" && "$LOCAL_HASH" == "$ART_HASH" && "$LOCAL_HASH" == "$REL_HASH" ]]; then
            echo "✅ All sources match."
          else
            echo "❌ MISMATCH."
            exit 1
          fi
